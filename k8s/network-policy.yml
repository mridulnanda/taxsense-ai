apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taxsense-default-deny
  namespace: taxsense
  labels:
    app: taxsense
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taxsense-app-policy
  namespace: taxsense
  labels:
    app: taxsense
    component: web
spec:
  podSelector:
    matchLabels:
      app: taxsense
      component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    # Allow traffic from other pods in the same namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow traffic to database
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow traffic to redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow traffic to Elasticsearch
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch
      ports:
        - protocol: TCP
          port: 9200
    # Allow external HTTPS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taxsense-worker-policy
  namespace: taxsense
  labels:
    app: taxsense
    component: worker
spec:
  podSelector:
    matchLabels:
      app: taxsense
      component: worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from web pods only
    - from:
        - podSelector:
            matchLabels:
              app: taxsense
              component: web
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow traffic to database
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow traffic to redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow external HTTPS for API calls
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
