apiVersion: v1
kind: ConfigMap
metadata:
  name: taxsense-config
  namespace: taxsense
  labels:
    app: taxsense
    component: config
data:
  NODE_ENV: production
  LOG_LEVEL: info
  ENVIRONMENT: kubernetes
  API_TIMEOUT: "30000"
  REQUEST_TIMEOUT: "60000"
  MAX_RETRIES: "3"
  CACHE_TTL: "3600"
  REDIS_DB: "0"
  DATABASE_POOL_MIN: "5"
  DATABASE_POOL_MAX: "20"
  METRICS_PORT: "9090"
  HEALTH_CHECK_INTERVAL: "30"
  GRACEFUL_SHUTDOWN_TIMEOUT: "30000"
---
apiVersion: v1
kind: Secret
metadata:
  name: taxsense-secrets
  namespace: taxsense
  labels:
    app: taxsense
    component: secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://taxsense:CHANGE_ME@postgres:5432/taxsense"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379"
  JWT_SECRET: "CHANGE_ME_TO_SECURE_SECRET"
  ENCRYPTION_KEY: "CHANGE_ME_TO_SECURE_KEY"
  ANTHROPIC_API_KEY: "CHANGE_ME_TO_YOUR_ANTHROPIC_KEY"
  OPENAI_API_KEY: "CHANGE_ME_TO_YOUR_OPENAI_KEY"
  SUPABASE_URL: "CHANGE_ME_TO_YOUR_SUPABASE_URL"
  SUPABASE_ANON_KEY: "CHANGE_ME_TO_YOUR_SUPABASE_KEY"
  GROQ_API_KEY: "CHANGE_ME_TO_YOUR_GROQ_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: taxsense-docker-registry
  namespace: taxsense
  labels:
    app: taxsense
    component: registry
type: kubernetes.io/dockercfg
data:
  .dockercfg: |
    {
      "docker.io": {
        "auth": "CHANGE_ME_TO_BASE64_ENCODED_CREDENTIALS"
      }
    }
