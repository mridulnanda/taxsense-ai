apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taxsense-postgres-pvc
  namespace: taxsense
  labels:
    app: postgres
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taxsense-redis-pvc
  namespace: taxsense
  labels:
    app: redis
    component: cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taxsense-elasticsearch-pvc
  namespace: taxsense
  labels:
    app: elasticsearch
    component: logging
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taxsense-backups-pvc
  namespace: taxsense
  labels:
    app: taxsense
    component: backups
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: shared-nfs
  resources:
    requests:
      storage: 500Gi
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd
  labels:
    app: taxsense
provisioner: ebs.csi.aws.amazonaws.com
allowVolumeExpansion: true
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: shared-nfs
  labels:
    app: taxsense
provisioner: nfs.csi.k8s.io
allowVolumeExpansion: true
parameters:
  server: nfs.taxsense.svc.cluster.local
  path: "/exports/backups"
