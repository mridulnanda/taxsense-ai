apiVersion: v1
kind: ServiceAccount
metadata:
  name: taxsense
  namespace: taxsense
  labels:
    app: taxsense
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: taxsense-reader
  labels:
    app: taxsense
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: taxsense-reader-binding
  labels:
    app: taxsense
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: taxsense-reader
subjects:
  - kind: ServiceAccount
    name: taxsense
    namespace: taxsense
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taxsense-pod-reader
  namespace: taxsense
  labels:
    app: taxsense
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taxsense-pod-reader-binding
  namespace: taxsense
  labels:
    app: taxsense
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: taxsense-pod-reader
subjects:
  - kind: ServiceAccount
    name: taxsense
    namespace: taxsense
